<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URNID SOLUTIONS — Visit Card</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #060918;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background mesh */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(139, 92, 246, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(14, 165, 233, 0.04) 0%, transparent 50%);
      animation: meshShift 20s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes meshShift {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      50% {
        transform: translate(2%, -1%) rotate(2deg);
      }
      100% {
        transform: translate(-1%, 2%) rotate(-1deg);
      }
    }

    /* Floating decorative elements */
    .deco {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
    }

    .deco-1 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #38bdf8, transparent 70%);
      top: -100px;
      right: -100px;
      animation: floatA 8s ease-in-out infinite alternate;
    }

    .deco-2 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #8b5cf6, transparent 70%);
      bottom: -50px;
      left: -50px;
      animation: floatB 10s ease-in-out infinite alternate;
    }

    @keyframes floatA {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(-30px, 30px) scale(1.1);
      }
    }

    @keyframes floatB {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(30px, -30px) scale(1.15);
      }
    }

    /* Card container */
    .card-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .card {
      width: 420px;
      min-height: 640px;
      background: linear-gradient(145deg, rgba(15, 18, 37, 0.95), rgba(10, 13, 30, 0.98));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(56, 189, 248, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.7),
        0 0 100px rgba(56, 189, 248, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Card glow border */
    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, #8b5cf6, transparent);
      border-radius: 24px 24px 0 0;
    }

    /* Subtle grid pattern on card */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      border-radius: 24px;
    }

    .card-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
    }

    /* Glow dot top right */
    .glow-dot {
      position: absolute;
      top: 20px;
      right: 24px;
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(0.85);
      }
    }

    /* Logo area */
    .logo-area {
      width: 80px;
      height: 80px;
      margin-bottom: 1rem;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-area::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(139, 92, 246, 0.2));
      z-index: -1;
    }

    /* Company name */
    .company-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #38bdf8, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
    }

    .tagline {
      font-size: 0.8rem;
      color: rgba(148, 163, 184, 0.7);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 1.75rem;
    }

    /* Divider */
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      border-radius: 2px;
      margin-bottom: 1.75rem;
    }

    /* Person info */
    .person-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.15rem;
    }

    .person-role {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    /* Product pill */
    .product-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 1rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      font-size: 0.75rem;
      color: #38bdf8;
      font-weight: 500;
      letter-spacing: 0.05em;
      margin-bottom: 1.75rem;
    }

    .product-pill svg {
      width: 14px;
      height: 14px;
    }

    /* Contact info */
    .contact-info {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-bottom: 1.75rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.82rem;
      color: #cbd5e1;
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact-item:hover {
      color: #38bdf8;
    }

    .contact-item .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: #38bdf8;
      opacity: 0.8;
    }

    /* QR Code area */
    .qr-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      width: 100%;
    }

    #qrcode {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      padding: 4px;
    }

    #qrcode img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .qr-label {
      flex: 1;
    }

    .qr-label span {
      display: block;
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.15rem;
    }

    .qr-label strong {
      display: block;
      font-size: 0.85rem;
      color: #e2e8f0;
      font-weight: 600;
    }

    .qr-label .hint {
      font-size: 0.65rem;
      color: #475569;
      margin-top: 0.1rem;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .btn {
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(56, 189, 248, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    /* Footer credit on card back */
    .card-footer {
      margin-top: auto;
      padding-top: 1rem;
      font-size: 0.6rem;
      color: #334155;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Print styles */
    @media print {
      body {
        background: #fff;
        padding: 0;
        min-height: auto;
        display: block;
      }

      body::before,
      .deco,
      .actions {
        display: none !important;
      }

      .card-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .card {
        box-shadow: none;
        border: 2px solid #e2e8f0;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        transform: none !important;
      }

      .card::before {
        display: none;
      }

      .glow-dot {
        display: none;
      }

      .btn {
        display: none;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .card {
        width: 100%;
        min-height: auto;
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Decorative elements -->
  <div class="deco deco-1"></div>
  <div class="deco deco-2"></div>

  <div class="card-wrapper">
    <!-- Visit Card -->
    <div class="card" id="visitCard">
      <div class="glow-dot"></div>

      <div class="card-content">

        <!-- Logo -->
        <div class="logo-area">
          <img src="./images/logo.png" alt="URNID SOLUTIONS" />
        </div>

        <!-- Company Name -->
        <div class="company-name">URNID SOLUTIONS</div>
        <div class="tagline">SaaS pour PME Marocaines</div>

        <div class="divider"></div>

        <!-- Person -->
        <div class="person-name">Taha Alami Idrissi</div>
        <div class="person-role">Fondateur</div>

        <!-- Product -->
        <div class="product-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            <path d="M9 14l2 2 4-4"/>
          </svg>
          ElectroStock
        </div>

        <!-- Contact Info -->
        <div class="contact-info">
          <a href="https://urnid-solutions.com" class="contact-item" target="_blank">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            urnid-solutions.com
          </a>
          <a href="mailto:taha.alami.idrissi@gmail.com" class="contact-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            taha.alami.idrissi@gmail.com
          </a>
          <span class="contact-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            Morocco
          </span>
        </div>

        <!-- QR Code -->
        <div class="qr-section">
          <div id="qrcode"></div>
          <div class="qr-label">
            <span>Scan me</span>
            <strong>urnid-solutions.com</strong>
            <span class="hint">Visit our website</span>
          </div>
        </div>

        <div class="card-footer">SaaS · Smart · Simple</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" onclick="window.print()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
        Print / PDF
      </button>
      <button class="btn btn-secondary" onclick="downloadCard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download PNG
      </button>
    </div>
  </div>

  <script>
    // Generate QR Code
    new QRCode(document.getElementById('qrcode'), {
      text: 'https://urnid-solutions.com',
      width: 70,
      height: 70,
      colorDark: '#0f1225',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H,
    });

    // Download card as PNG using canvas
    function downloadCard() {
      const card = document.getElementById('visitCard');

      // Temporarily hide buttons for clean capture
      const actions = document.querySelector('.actions');
      actions.style.opacity = '0';

      // Use html2canvas if available, otherwise fallback
      if (typeof html2canvas !== 'undefined') {
        html2canvas(card, {
          backgroundColor: '#060918',
          scale: 3,
          useCORS: true,
          allowTaint: false,
          logging: false,
        }).then((canvas) => {
          const link = document.createElement('a');
          link.download = 'urnid-solutions-visit-card.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          actions.style.opacity = '1';
        }).catch(() => {
          actions.style.opacity = '1';
          fallbackDownload();
        });
      } else {
        actions.style.opacity = '1';
        fallbackDownload();
      }
    }

    function fallbackDownload() {
      // Load html2canvas dynamically then retry
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
      script.onload = () => {
        document.querySelector('.actions').style.opacity = '0';
        html2canvas(document.getElementById('visitCard'), {
          backgroundColor: '#060918',
          scale: 3,
          useCORS: true,
          allowTaint: false,
          logging: false,
        }).then((canvas) => {
          const link = document.createElement('a');
          link.download = 'urnid-solutions-visit-card.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          document.querySelector('.actions').style.opacity = '1';
        }).catch(() => {
          document.querySelector('.actions').style.opacity = '1';
          alert('Please use "Print / PDF" instead, or take a screenshot.');
        });
      };
      script.onerror = () => {
        document.querySelector('.actions').style.opacity = '1';
        alert('Please use "Print / PDF" instead, or take a screenshot.');
      };
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
