<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URNID SOLUTIONS — Business Card</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #1A2B5F;
      --royal: #1D4ED8;
      --medium: #2563EB;
      --bright: #3B82F6;
      --amber: #F59E0B;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .card {
      width: 85mm;
      height: 55mm;
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }

    /* ===== FRONT ===== */
    .card-front {
      background: var(--white);
    }

    /* Split layout: left navy panel + right white content */
    .card-front::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 29mm;
      height: 100%;
      background: var(--navy);
      z-index: 0;
    }

    /* Accent bar on top */
    .card-front .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2.5px;
      background: linear-gradient(90deg, var(--royal), var(--medium), var(--bright));
      z-index: 3;
    }

    /* Amber dot */
    .amber-dot {
      position: absolute;
      top: 4mm;
      right: 4.5mm;
      width: 4px;
      height: 4px;
      background: var(--amber);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(245,158,11,0.4);
      z-index: 3;
    }

    .front-inner {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
    }

    /* Left navy panel content */
    .left-panel {
      width: 29mm;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3mm 2mm;
      position: relative;
      z-index: 2;
    }

    .left-panel .logo-wrap {
      width: 11mm;
      height: 11mm;
      background: rgba(255,255,255,0.08);
      border-radius: 3mm;
      padding: 2mm;
      border: 0.5px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2mm;
    }

    .left-panel .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .left-panel .initials {
      font-size: 7px;
      font-weight: 800;
      color: rgba(255,255,255,0.15);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 1mm;
    }

    /* Vertical divider line between panels */
    .panel-divider {
      width: 0.5px;
      background: rgba(37,99,235,0.08);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    /* Right content */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4mm 5mm 4mm 4.5mm;
      position: relative;
      z-index: 2;
    }

    .right-company {
      font-size: 11px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: 0.3px;
      line-height: 1.2;
    }

    .right-tagline {
      font-size: 5.5px;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      font-weight: 700;
      color: var(--medium);
      margin-top: 0.5mm;
    }

    .right-divider {
      width: 12mm;
      height: 2px;
      background: linear-gradient(90deg, var(--royal), var(--bright));
      border-radius: 2px;
      margin: 3mm 0 2.5mm;
    }

    .right-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.3px;
      line-height: 1.2;
    }

    .right-role {
      font-size: 6.5px;
      color: #64748b;
      font-weight: 500;
      margin-top: 0.3mm;
      letter-spacing: 0.3px;
    }

    .right-contact {
      display: flex;
      flex-direction: column;
      gap: 0.7mm;
      margin-top: 2.5mm;
    }

    .right-contact .row {
      display: flex;
      align-items: center;
      gap: 1.8mm;
    }

    .right-contact .row svg {
      width: 6.5px;
      height: 6.5px;
      flex-shrink: 0;
      color: var(--royal);
      opacity: 0.6;
    }

    .right-contact .row span {
      font-size: 6px;
      color: #475569;
      font-weight: 400;
    }

    /* Decorative thin line on right edge */
    .edge-line {
      position: absolute;
      right: 0;
      top: 10mm;
      bottom: 10mm;
      width: 1.5px;
      background: linear-gradient(180deg, transparent, rgba(37,99,235,0.08), transparent);
      z-index: 2;
    }

    /* ===== BACK ===== */
    .card-back {
      background: var(--navy);
    }

    .card-back .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2.5px;
      background: linear-gradient(90deg, transparent 5%, var(--medium), var(--bright), transparent 95%);
      z-index: 3;
    }

    .card-back .glow {
      position: absolute;
      top: -30mm;
      right: -20mm;
      width: 60mm;
      height: 60mm;
      background: radial-gradient(circle, rgba(37,99,235,0.1), transparent 70%);
      pointer-events: none;
    }

    .card-back .glow-2 {
      position: absolute;
      bottom: -15mm;
      left: -15mm;
      width: 40mm;
      height: 40mm;
      background: radial-gradient(circle, rgba(245,158,11,0.06), transparent 70%);
      pointer-events: none;
    }

    .card-back-inner {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 4.5mm 5mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .back-label {
      font-size: 5.5px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 2.5px;
      font-weight: 500;
      margin-bottom: 2mm;
    }

    .back-accent {
      width: 6mm;
      height: 2px;
      background: var(--amber);
      border-radius: 2px;
      margin-bottom: 2.5mm;
    }

    .back-value-prop {
      font-size: 8px;
      color: rgba(255,255,255,0.85);
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 2.5mm;
      max-width: 65mm;
    }

    .back-value-prop span {
      color: var(--bright);
    }

    #back-qr {
      width: 18mm;
      height: 18mm;
      background: var(--white);
      padding: 1.5mm;
      border-radius: 2mm;
      margin-bottom: 2mm;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .back-cta {
      display: inline-flex;
      align-items: center;
      gap: 1.5mm;
      padding: 1mm 3mm;
      background: rgba(59,130,246,0.12);
      border: 0.5px solid rgba(59,130,246,0.25);
      border-radius: 3mm;
      font-size: 6px;
      color: var(--bright);
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .back-cta svg {
      width: 7px;
      height: 7px;
    }

    .back-url {
      font-size: 5px;
      color: rgba(255,255,255,0.35);
      margin-top: 1.5mm;
      letter-spacing: 0.5px;
    }

    /* Download toolbar */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-dl {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-dl svg {
      width: 16px;
      height: 16px;
    }

    .btn-dl-primary {
      background: var(--navy);
      color: var(--white);
    }

    .btn-dl-primary:hover {
      background: var(--royal);
      transform: translateY(-1px);
    }

    .btn-dl-secondary {
      background: rgba(26,43,95,0.06);
      color: var(--navy);
      border: 1px solid rgba(26,43,95,0.15);
    }

    .btn-dl-secondary:hover {
      background: rgba(26,43,95,0.1);
      transform: translateY(-1px);
    }

    /* Print */
    @media print {
      body { background: #fff; padding: 0; gap: 0; }
      .toolbar { display: none !important; }
      .card { box-shadow: none; border-radius: 0; page-break-after: always;
        -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @page { margin: 0; size: A4 portrait; }
  </style>
</head>
<body>

  <!-- === FRONT === -->
  <div class="card card-front">
    <div class="top-bar"></div>
    <div class="amber-dot"></div>
    <div class="edge-line"></div>
    <div class="front-inner">
      <!-- Left navy panel -->
      <div class="left-panel">
        <div class="logo-wrap">
          <img src="./images/logo.png" alt="URNID" />
        </div>
        <div class="initials">URNID</div>
      </div>
      <div class="panel-divider"></div>
      <!-- Right content -->
      <div class="right-panel">
        <div class="right-company">URNID SOLUTIONS</div>
        <div class="right-tagline">YOUR problem our solution</div>
        <div class="right-divider"></div>
        <div class="right-name">Taha Alami Idrissi</div>
        <div class="right-role">Fondateur</div>
        <div class="right-contact">
          <div class="row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>taha.alami.idrissi@gmail.com</span>
          </div>
          <div class="row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span>urnid-solutions.com</span>
          </div>
          <div class="row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>Casablanca, Maroc</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- === BACK === -->
  <div class="card card-back">
    <div class="bottom-bar"></div>
    <div class="glow"></div>
    <div class="glow-2"></div>
    <div class="card-back-inner">
      <div class="back-label">Digitalisez votre stock</div>
      <div class="back-accent"></div>
      <div class="back-value-prop">
        Gérez votre inventaire en <span>temps réel</span>.<br/>
        Plus de pertes. Plus d'erreurs. <span>100% traçable</span>.
      </div>
      <div id="back-qr"></div>
      <div class="back-cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Decouvrir ElectroStock
      </div>
      <div class="back-url">urnid-solutions.com</div>
    </div>
  </div>

  <!-- === TOOLBAR === -->
  <div class="toolbar">
    <button class="btn-dl btn-dl-primary" onclick="downloadPDF()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PDF
    </button>
    <button class="btn-dl btn-dl-secondary" onclick="downloadPNG()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PNG
    </button>
  </div>

  <script>
    new QRCode(document.getElementById('back-qr'), {
      text: 'https://urnid-solutions.com',
      width: 54,
      height: 54,
      colorDark: '#1A2B5F',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H,
    });

    function downloadPDF() {
      window.print()
    }

    function downloadPNG() {
      const btn = document.querySelector('.btn-dl-secondary');
      btn.textContent = 'Generating...';
      btn.disabled = true;

      // Load html2canvas on demand
      if (typeof html2canvas === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
        script.onload = function() {
          generatePNG(btn);
        };
        script.onerror = function() {
          alert('Could not load image generator. Please use "Download PDF" instead (then save as PDF from the print dialog).');
          btn.textContent = 'Download PNG';
          btn.disabled = false;
        };
        document.head.appendChild(script);
      } else {
        generatePNG(btn);
      }
    }

    function generatePNG(btn) {
      const frontCard = document.querySelector('.card-front');
      const backCard = document.querySelector('.card-back');

      // Create a temp container with both cards stacked
      const container = document.createElement('div');
      container.style.cssText = 'position:fixed; left:-9999px; top:0; background:#fff;';
      container.innerHTML = `
        <div style="width:85mm; height:55mm; margin-bottom:5mm; position:relative;">${frontCard.innerHTML}</div>
        <div style="width:85mm; height:55mm; position:relative;">${backCard.innerHTML}</div>
      `;
      document.body.appendChild(container);

      // Copy computed styles inline for html2canvas
      const frontClone = container.firstElementChild;
      const backClone = container.lastElementChild;
      frontClone.className = frontCard.className;
      backClone.className = backCard.className;

      // Add pseudo-elements via inline styles where possible
      const styleEl = document.createElement('style');
      styleEl.textContent = `
        .card-front::after { content:''; position:absolute; top:0; left:0; width:29mm; height:100%; background:#1A2B5F; z-index:0; }
        .card-front .top-bar { position:absolute; top:0; left:0; right:0; height:2.5px; background:linear-gradient(90deg,#1D4ED8,#2563EB,#3B82F6); z-index:3; }
        .card-back .bottom-bar { position:absolute; bottom:0; left:0; right:0; height:2.5px; background:linear-gradient(90deg,transparent 5%,#2563EB,#3B82F6,transparent 95%); z-index:3; }
      `;
      container.appendChild(styleEl);

      // Wait for images to load
      setTimeout(function() {
        html2canvas(container, {
          scale: 4,
          backgroundColor: '#e8e8e8',
          useCORS: true,
          logging: false,
        }).then(function(canvas) {
          document.body.removeChild(container);
          const link = document.createElement('a');
          link.download = 'urnid-solutions-business-card.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          btn.textContent = 'Download PNG';
          btn.disabled = false;
        }).catch(function() {
          document.body.removeChild(container);
          // Fallback: try capturing each card separately
          captureSeparate(btn);
        });
      }, 500);
    }

    function captureSeparate(btn) {
      const canvas = document.createElement('canvas');
      canvas.width = 85 * 8;  // 8px per mm
      canvas.height = 110 * 8; // two cards stacked
      const ctx = canvas.getContext('2d');

      // Capture printed version via print as fallback
      alert('PNG generation failed. Please use "Download PDF" instead.');
      btn.textContent = 'Download PNG';
      btn.disabled = false;
    }
  </script>
</body>
</html>
